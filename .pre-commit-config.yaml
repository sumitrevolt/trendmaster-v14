# Pre-commit hooks for TrendMaster v14.
#
# Install once:    pip install pre-commit && pre-commit install
# Run manually:    pre-commit run --all-files
#
# These hooks must stay in sync with .github/workflows/ci.yml so a green
# pre-commit run guarantees a green CI run. Anything added here should
# also be added in CI (and vice-versa).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Project-local hooks.
  - repo: local
    hooks:
      # Hard guard against committing .env files. The CI job repeats
      # this but a local pre-commit catches it before the bad commit
      # even leaves Sumit's machine. (Must be `local` — the
      # `forbidden-file` id is NOT part of pre-commit-hooks; it's the
      # "fail" language pattern.)
      - id: forbid-env-files
        name: forbid .env files
        entry: env files must never be committed (use .env.example instead)
        language: fail
        files: '(^|/)\.env$'

      # Keep the code-review-graph DB in sync on every commit, so queries
      # like detect-changes / get_impact_radius reflect the state being
      # committed. Non-blocking: a broken CLI must never block a commit.
      # Skips silently if the CLI isn't installed or git diff fails.
      - id: code-review-graph-update
        name: code-review-graph incremental update
        entry: python tools/crg_hook.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Verify the ai_trading_agents/ NTFS junction is still intact
      # AFTER the auto-fix hooks (ruff --fix, ruff-format,
      # end-of-file-fixer) have run. Pre-commit's git stash/restore
      # cycle has been observed replacing the junction with a real
      # folder when reformatting touches files inside it; this guard
      # blocks the commit instead of silently corrupting the worktree.
      # Skips silently on non-Windows. See
      # docs/POSTMORTEMS/2026-04-26_pre_commit_junction_breakage.md.
      - id: check-junction
        name: ai_trading_agents junction guard
        entry: python tools/check_junction.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Auto-heal the junction AFTER the commit lands. Observed
      # 2026-04-30: pre-commit's `[INFO] Restored changes from ...`
      # stash-pop step (which runs *after* all pre-commit hooks
      # finish) replaces the junction with a real folder. The
      # pre-commit-stage check-junction hook can't catch this because
      # it runs before the breaking step. This post-commit invocation
      # detects the breakage and runs tools/restore_junction.cmd.
      # Operator must enable post-commit hooks once via:
      #   pre-commit install --hook-type post-commit
      # See docs/POSTMORTEMS/2026-04-30_junction_trap_silent_state_drift.md.
      - id: heal-junction
        name: ai_trading_agents junction auto-heal
        entry: python tools/check_junction.py --heal
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit, post-checkout, post-merge]

      # Run the project's pytest suite locally before the commit lands.
      # This is intentionally quick — heavy backtests run in CI, not here.
      - id: pytest-quick
        name: pytest (quick subset)
        entry: pytest -q --no-cov tests/
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Hard guard: NEVER allow `.resolve()` inside ai_trading_agents/.
      # The junction at ai_trading_agents/ -> C:\TrendMaster_aita_canonical\
      # makes Path(__file__).resolve().parent.parent return C:\ instead of the
      # project root, silently breaking every config-file lookup. This
      # regression has been hit FOUR times (2026-04-25, 2026-04-30, 2026-05-01,
      # 2026-05-06). Each time it was a half-day debug session.
      # See CLAUDE.md "Brain path resolution rule" + 4 postmortems.
      - id: no-resolve-in-brain
        name: forbid .resolve() inside ai_trading_agents/
        entry: python tools/check_no_resolve.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
