name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # MetaTrader5 is Windows-only — exclude from CI
          pip install pandas numpy python-dotenv ta scikit-learn \
                      pytest pytest-cov colorlog \
                      fastapi uvicorn requests aiohttp schedule

      - name: Syntax-check every .py
        run: python -m compileall -q ai_trading_agents config tools tests main.py

      - name: Guard — no committed .env files
        # We keep .env.example checked in but actual .env files must NEVER
        # be committed (they hold the Telegram bot token and broker creds).
        # Fails CI loudly if anyone slips one in.
        run: |
          if find . -path ./.git -prune -o -type f -name '.env' -print | grep -q .; then
            echo "::error::Committed .env file detected — secrets must never be checked in."
            find . -path ./.git -prune -o -type f -name '.env' -print
            exit 1
          fi

      - name: Run pytest
        run: pytest --cov=ai_trading_agents --cov=tools --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Hard-fails on lint errors. Configuration in pyproject.toml /
      # ruff.toml — keep that authoritative so local pre-commit and CI
      # agree byte-for-byte.
      - name: Ruff
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
