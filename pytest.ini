[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers
    --ignore=tests/run_test.py
    --ignore=tests/test_chat.py
    --ignore=tests/test_trade.py
markers =
    mt5: test requires a live MetaTrader5 install (skipped in CI)
    slow: slow backtest or training tests
filterwarnings =
    ignore::DeprecationWarning:pandas.*
    ignore::FutureWarning:pandas.*
